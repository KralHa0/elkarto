[platformio]
src_dir = src

[env:main]
platform = ststm32
board = genericSTM32F405RG
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_src_filter = +<*> -<debug_motor_main.c>
; framework links with --specs=nano.specs, which strips float support from
; printf/scanf by default -- pull it back in for telemetry's %f formatting
; and telemetryGetGainUpdate()'s sscanf("%f", ...) gain parsing.
build_flags = -Wl,-u,_printf_float -Wl,-u,_scanf_float

[env:motor_debug]
platform = ststm32
board = genericSTM32F405RG
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_src_filter = -<*> +<debug_motor_main.c> +<brake/l298n.c>
